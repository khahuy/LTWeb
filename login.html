<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Góc Bàn Học - website bán văn phòng phẩm và phụ kiện bàn học.">
  <title>Đăng nhập | Góc Bàn Học</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-card " aria-labelledby="auth-title">
    <a class="brand" href="index.html" aria-label="Về trang chủ Góc Bàn Học">
    <span class="brand-mark">GBH</span>
    <span>Góc Bàn Học<small>Gọn góc học tập, sáng ý tưởng.</small></span>
  </a>
    <h1 id="auth-title">Đăng nhập khách hàng</h1>
<p class="muted">Đăng nhập để tiếp tục mua sắm và xem đơn hàng của bạn.</p>

<form novalidate data-demo-form data-submit-message="Đăng nhập thành công!" data-redirect="home-logged-in.html">
  <div class="form-group"><label for="login-email">Email hoặc tên đăng nhập</label><input class="form-control" id="login-email" name="email" type="text" placeholder="Nhập thông tin"></div>
  <div class="form-group"><label for="login-password">Mật khẩu</label><input class="form-control" id="login-password" name="password" type="password" placeholder="Nhập thông tin"></div>
  <button class="button button-primary button-block" type="submit">Đăng nhập</button>
</form>
<div class="form-footer"><a href="index.html">← Về trang chủ</a><span>Chưa có tài khoản? <a href="register.html"><strong>Đăng ký</strong></a></span></div>
  </section>
</main>
<script src="js/main.js"></script>
</body>
</html>
