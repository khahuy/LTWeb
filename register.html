<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Góc Bàn Học - website bán văn phòng phẩm và phụ kiện bàn học.">
  <title>Đăng ký | Góc Bàn Học</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-card auth-card-wide" aria-labelledby="auth-title">
    <a class="brand" href="index.html" aria-label="Về trang chủ Góc Bàn Học">
    <span class="brand-mark">GBH</span>
    <span>Góc Bàn Học<small>Gọn góc học tập, sáng ý tưởng.</small></span>
  </a>
    <h1 id="auth-title">Đăng ký khách hàng</h1>
<p class="muted">Tạo tài khoản và bắt đầu sắp lại góc học tập của bạn.</p>

<form class="form-grid" novalidate data-demo-form data-submit-message="Đăng ký thành công!" data-redirect="login.html">
  <div class="form-group"><label for="register-name">Họ và tên</label><input class="form-control" id="register-name" name="name" type="text" placeholder="Nguyễn Văn A"></div>
  <div class="form-group"><label for="register-phone">Số điện thoại</label><input class="form-control" id="register-phone" name="phone" type="text" placeholder="0901234567"></div>
  <div class="form-group form-group-full"><label for="register-email">Email</label><input class="form-control" id="register-email" name="email" type="text" placeholder="nguyenvana@example.com"></div>
  <div class="form-group"><label for="register-password">Mật khẩu</label><input class="form-control" id="register-password" name="password" type="password" placeholder="Nhập thông tin"></div>
  <div class="form-group"><label for="register-confirm">Xác nhận mật khẩu</label><input class="form-control" id="register-confirm" name="confirm" type="password" placeholder="Nhập lại dữ liệu mẫu"></div>
  <div class="form-group form-group-full"><label class="check-row"><input type="checkbox" name="terms"> Tôi đồng ý với điều khoản sử dụng.</label></div>
  <div class="form-group form-group-full"><button class="button button-primary button-block" type="submit">Đăng ký</button></div>
</form>
<div class="form-footer"><a href="index.html">← Về trang chủ</a><span>Đã có tài khoản? <a href="login.html"><strong>Đăng nhập</strong></a></span></div>
  </section>
</main>
<script src="js/main.js"></script>
</body>
</html>
